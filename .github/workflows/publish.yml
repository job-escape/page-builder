name: Publish package

on:
  push:
    # `main` carries the current line; a `<major>.<minor>.x` branch carries a
    # maintenance one, so a fix can reach the apps still pinned to it without
    # dragging in whatever main has moved on to. Both publish the same way —
    # otherwise a maintenance release can only go out by hand, which is a bad
    # thing to discover during an outage of the endpoint that does it.
    branches: [main, '[0-9]+.[0-9]+.x']
    paths:
      - 'package.json'
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@job-escape'
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Skip if version already published
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VERSION already published — skipping."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - if: steps.check.outputs.already_published == 'false'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-* ]]; then
            echo "Publishing prerelease $VERSION under the 'beta' dist-tag"
            npm publish --tag beta
          else
            npm publish
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
